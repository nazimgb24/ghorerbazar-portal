        const State = getGlobalState();

        function saveState() {
            localStorage.setItem('gb_global_current_user_v13', JSON.stringify(State.currentUser));
            localStorage.setItem('gb_global_users_v13', JSON.stringify(State.users));
            localStorage.setItem('gb_global_attendance_v13', JSON.stringify(State.attendance));
            localStorage.setItem('gb_global_reports_v13', JSON.stringify(State.reports));
            localStorage.setItem('gb_global_targets_v13', JSON.stringify(State.targets));
            localStorage.setItem('gb_global_roster_v13', JSON.stringify(State.roster));
            localStorage.setItem('gb_admin_tab_v13', State.adminTab);
            localStorage.setItem('gb_admin_view_v13', State.adminViewMode);
            localStorage.setItem('gb_selected_agent_v13', State.selectedAgentDetails || '');
            localStorage.setItem('gb_agent_tab_v13', State.agentTab);
        }

        // Real-time Storage Sync across tabs/users instantly
        window.addEventListener('storage', (e) => {
            if (e.key && e.key.startsWith('gb_global_')) {
                Object.assign(State, getGlobalState());
                render();
            }
        });

        // Live Clock Timer loop
        setInterval(() => {
            const clockEl = document.getElementById('liveClock');
            if (clockEl) {
                clockEl.textContent = new Date().toLocaleTimeString();
            }
        }, 1000);

        function render() {
            const currentFresh = getGlobalState();
            Object.assign(State, currentFresh);

            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!State.currentUser) {
                app.innerHTML = renderLogin();
                attachLoginEvents();
            } else if (State.currentUser.role === 'admin') {
                app.innerHTML = renderAdminDashboard(false);
                attachAdminEvents();
            } else if (State.currentUser.role === 'supervisor') {
                app.innerHTML = renderAdminDashboard(true);
                attachAdminEvents();
            } else {
                app.innerHTML = renderAgentDashboard();
                attachAgentEvents();
            }
        }

        function renderLogin() {
            return `
                <div class="flex-grow flex items-center justify-center p-4 bg-slate-100">
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-xl w-full max-w-md p-8 relative">
                        <div class="text-center mb-8">
                            <div class="inline-flex bg-orange-500 text-white p-3.5 rounded-2xl shadow-md mb-4 items-center justify-center font-bold text-xl tracking-wider">
                                GB
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">GhorerBazar</h1>
                            <p class="text-xs text-orange-600 mt-1 uppercase tracking-widest font-semibold">Sales Performance Portal</p>
                        </div>
                        <form id="loginForm" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Username (Emp ID)</label>
                                <input type="text" id="username" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-orange-500 transition text-sm" placeholder="Enter Emp ID">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Password</label>
                                <input type="password" id="password" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-orange-500 transition text-sm" placeholder="Enter password">
                            </div>
                            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-md text-sm">
                                Secure Sign In &rarr;
                            </button>
                        </form>
                        <div id="loginError" class="mt-4 text-red-500 text-center text-sm hidden font-medium"></div>
                    </div>
                </div>
            `;
        }

        function attachLoginEvents() {
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value.trim();
                
                const found = State.users.find(x => String(x.username).trim() === u && String(x.password).trim() === p);
                
                if (found) {
                    if (found.role === 'agent' && found.active === false) {
                        const err = document.getElementById('loginError');
                        err.textContent = 'Your account has been deactivated by Admin!';
                        err.classList.remove('hidden');
                        return;
                    }

                    State.currentUser = found;
                    if (found.role === 'agent') {
                        const active = State.attendance.find(a => a.username === found.username && !a.logoutTime);
                        if (!active) {
                            State.attendance.push({
                                username: found.username,
                                name: found.name,
                                team: found.team,
                                loginTime: new Date().toLocaleTimeString(),
                                logoutTime: null,
                                onBreak: false,
                                breakReason: ''
                            });
                        }
                    }
                    saveState();
                    render();
                } else {
                    const err = document.getElementById('loginError');
                    err.textContent = 'Invalid username or password!';
                    err.classList.remove('hidden');
                }
            });
        }

        function renderRosterHTML(isEditable = false) {
            let html = `<div class="space-y-8">`;
            for (const [teamName, members] of Object.entries(State.roster)) {
                html += `
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-4">
                        <h3 class="text-base font-bold text-slate-900 border-b pb-2">Team: Facebook (${teamName.replace('Team ', '')})</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-700 border-collapse border border-slate-200">
                                <thead class="bg-slate-100 text-slate-700 uppercase">
                                    <tr>
                                        <th class="border border-slate-300 p-2 text-center">Sl. No.</th>
                                        <th class="border border-slate-300 p-2">Emp. ID</th>
                                        <th class="border border-slate-300 p-2">Name</th>
                                        <th class="border border-slate-300 p-2 text-center">Saturday</th>
                                        <th class="border border-slate-300 p-2 text-center">Sunday</th>
                                        <th class="border border-slate-300 p-2 text-center">Monday</th>
                                        <th class="border border-slate-300 p-2 text-center">Tuesday</th>
                                        <th class="border border-slate-300 p-2 text-center">Wednesday</th>
                                        <th class="border border-slate-300 p-2 text-center">Thursday</th>
                                        <th class="border border-slate-300 p-2 text-center">Friday</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;
                members.forEach((m, idx) => {
                    html += `
                        <tr class="hover:bg-slate-50">
                            <td class="border border-slate-300 p-2 text-center font-semibold">${idx + 1}</td>
                            <td class="border border-slate-300 p-2 font-semibold text-slate-600">${m.id}</td>
                            <td class="border border-slate-300 p-2 font-medium text-slate-900">${m.name}</td>
                    `;
                    ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'].forEach(day => {
                        const val = m[day];
                        const isDO = val === 'DO';
                        const cellBg = isDO ? 'bg-orange-100 text-orange-800 font-bold' : '';
                        if (isEditable) {
                            html += `<td class="border border-slate-300 p-1 text-center ${cellBg}">
                                <input type="text" value="${val}" onchange="updateRosterCell('${teamName}', ${idx}, '${day}', this.value)" class="w-full text-center bg-transparent focus:bg-white focus:outline-none border-0 text-xs font-semibold">
                            </td>`;
                        } else {
                            html += `<td class="border border-slate-300 p-2 text-center ${cellBg}">${val}</td>`;
                        }
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table></div></div>`;
            }
            html += `</div>`;
            return html;
        }

        window.updateRosterCell = function(teamName, memberIdx, day, newVal) {
            if (State.roster[teamName] && State.roster[teamName][memberIdx]) {
                State.roster[teamName][memberIdx][day] = newVal.trim();
                saveState();
            }
        }

        function renderAdminDashboard(isSupervisor = false) {
            const activeAttendance = State.attendance.filter(a => !a.logoutTime);
            const agents = State.users.filter(u => u.role === 'agent' && u.active !== false);
            const allAgents = State.users.filter(u => u.role === 'agent');
            const todayStr = new Date().toLocaleDateString();

            const filteredReports = State.reports.filter(r => {
                if (State.adminViewMode === 'today') return r.date === todayStr;
                return true;
            });

            const totalSalesAll = filteredReports.reduce((sum, r) => sum + (r.amount || 0), 0);
            const totalOrdersAll = filteredReports.reduce((sum, r) => sum + (r.orders || 0), 0);
            const totalLeadsAll = filteredReports.reduce((sum, r) => sum + (r.leads || 0), 0);

            const agentStats = agents.map(agent => {
                const agentReports = filteredReports.filter(r => r.username === agent.username);
                const salesAmount = agentReports.reduce((sum, r) => sum + (r.amount || 0), 0);
                const leads = agentReports.reduce((sum, r) => sum + (r.leads || 0), 0);
                const orders = agentReports.reduce((sum, r) => sum + (r.orders || 0), 0);
                const conversion = leads > 0 ? ((orders / leads) * 100).toFixed(1) : 0;
                const target = State.targets[agent.username] || 50000;
                const ratio = target > 0 ? Math.min(Math.round((salesAmount / target) * 100), 100) : 0;
                return { name: agent.name, username: agent.username, team: agent.team, salesAmount, leads, orders, conversion, target, ratio };
            }).sort((a, b) => b.salesAmount - a.salesAmount);

            const teamsMap = {};
            agents.forEach(agent => {
                if (!teamsMap[agent.team]) {
                    teamsMap[agent.team] = { teamName: agent.team, totalSales: 0, totalTarget: 0, agentsCount: 0 };
                }
                teamsMap[agent.team].agentsCount += 1;
                teamsMap[agent.team].totalTarget += (State.targets[agent.username] || 50000);
                const agentSales = filteredReports.filter(r => r.username === agent.username).reduce((sum, r) => sum + (r.amount || 0), 0);
                teamsMap[agent.team].totalSales += agentSales;
            });
            const teamComparison = Object.values(teamsMap).sort((a, b) => b.totalSales - a.totalSales);

            let agentDetailViewHTML = '';
            if (State.selectedAgentDetails) {
                const selAgent = State.users.find(u => u.username === State.selectedAgentDetails);
                const selReports = State.reports.filter(r => r.username === State.selectedAgentDetails);
                const selTarget = State.targets[State.selectedAgentDetails] || 50000;
                const dailyTarget = Math.round(selTarget / 26);
                const totalSelSales = selReports.reduce((sum, r) => sum + (r.amount || 0), 0);
                const totalSelLeads = selReports.reduce((sum, r) => sum + (r.leads || 0), 0);
                const totalSelOrders = selReports.reduce((sum, r) => sum + (r.orders || 0), 0);
                const selConversion = totalSelLeads > 0 ? ((totalSelOrders / totalSelLeads) * 100).toFixed(1) : 0;
                const selRatio = selTarget > 0 ? Math.min(Math.round((totalSelSales / selTarget) * 100), 100) : 0;

                agentDetailViewHTML = `
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6">
                        <div class="flex justify-between items-center border-b pb-4">
                            <div>
                                <h3 class="text-xl font-bold text-slate-900">${selAgent ? selAgent.name : ''} (${State.selectedAgentDetails})</h3>
                                <p class="text-xs text-slate-500 mt-1">Team: ${selAgent ? selAgent.team : ''} | Monthly Target: ৳${selTarget.toLocaleString()} | Daily Target (÷26): ৳${dailyTarget.toLocaleString()}</p>
                            </div>
                            <button onclick="closeAgentDetails()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-4 py-1.5 rounded-lg text-xs font-semibold transition">&larr; Back</button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <p class="text-xs uppercase text-slate-500 font-semibold">Total Sales</p>
                                <h4 class="text-xl font-bold text-orange-600 mt-1">৳${totalSelSales.toLocaleString()} (${selRatio}%)</h4>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <p class="text-xs uppercase text-slate-500 font-semibold">Total Leads / Orders</p>
                                <h4 class="text-xl font-bold text-slate-900 mt-1">${totalSelLeads} / ${totalSelOrders}</h4>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <p class="text-xs uppercase text-slate-500 font-semibold">Conversion Rate</p>
                                <h4 class="text-xl font-bold text-blue-600 mt-1">${selConversion}%</h4>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <p class="text-xs uppercase text-slate-500 font-semibold">Reports Submitted</p>
                                <h4 class="text-xl font-bold text-purple-600 mt-1">${selReports.length} Entries</h4>
                            </div>
                        </div>

                        <div>
                            <h4 class="text-md font-bold text-slate-900 mb-3">Day-wise Performance Records</h4>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Date</th>
                                            <th class="p-3">Leads</th>
                                            <th class="p-3">Orders</th>
                                            <th class="p-3">Conversion</th>
                                            <th class="p-3">Sales Amount (BDT)</th>
                                            <th class="p-3">Daily Target Status</th>
                                            ${!isSupervisor ? '<th class="p-3">Action</th>' : ''}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${selReports.length === 0 ? `<tr><td colspan="${isSupervisor ? 6 : 7}" class="p-4 text-center text-slate-400">No reports found.</td></tr>` :
                                        selReports.map((r) => {
                                            const rIndex = State.reports.indexOf(r);
                                            const rConv = r.leads > 0 ? ((r.orders / r.leads) * 100).toFixed(1) : 0;
                                            const rDayRatio = dailyTarget > 0 ? Math.round(((r.amount || 0) / dailyTarget) * 100) : 0;
                                            return `
                                                <tr>
                                                    <td class="p-3 font-medium">${r.date}</td>
                                                    <td class="p-3">${r.leads}</td>
                                                    <td class="p-3">${r.orders}</td>
                                                    <td class="p-3 text-blue-600 font-semibold">${rConv}%</td>
                                                    <td class="p-3 text-orange-600 font-bold">৳${(r.amount || 0).toLocaleString()}</td>
                                                    <td class="p-3"><span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">${rDayRatio}% of daily target</span></td>
                                                    ${!isSupervisor ? `
                                                        <td class="p-3 flex gap-2">
                                                            <button onclick="editReportPrompt(${rIndex})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold">Edit</button>
                                                            <button onclick="deleteReport(${rIndex})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                                                        </td>
                                                    ` : ''}
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `

                                                        <div class="bg-orange-500 h-2.5 rounded-full" style="width: ${item.ratio}%"></div>
                                                    </div>
                                                    <span class="text-xs text-slate-500 mt-1 block">${item.ratio}% achieved</span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        window.setAdminTab = function(tabName) {
            State.adminTab = tabName;
            State.selectedAgentDetails = null;
            saveState();
            render();
        }

        window.setAdminViewMode = function(mode) {
            State.adminViewMode = mode;
            saveState();
            render();
        }

        window.viewAgentDetails = function(username) {
            State.selectedAgentDetails = username;
            saveState();
            render();
        }

        window.closeAgentDetails = function() {
            State.selectedAgentDetails = null;
            saveState();
            render();
        }

        window.toggleAgentStatus = function(id) {
            if (State.currentUser.role === 'supervisor') return;
            const user = State.users.find(u => u.id === id);
            if (user) {
                user.active = user.active === false ? true : false;
                saveState();
                render();
            }
        }

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(State));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "ghorerbazar_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.importData = function(event) {
            if (State.currentUser.role === 'supervisor') return;
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.users && parsed.reports) {
                            State.users = parsed.users;
                            State.reports = parsed.reports;
                            State.attendance = parsed.attendance || [];
                            State.targets = parsed.targets || {};
                            State.roster = parsed.roster || State.roster;
                            saveState();
                            alert('Data restored successfully!');
                            render();
                        } else {
                            alert('Invalid backup file format!');
                        }
                    } catch (err) {
                        alert('Error parsing JSON file!');
                    }
                };
            }
        }

        function attachAdminEvents() {
            if (State.currentUser.role === 'supervisor') return;

            const form = document.getElementById('createAgentForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('newName').value.trim();
                    const username = document.getElementById('newUsername').value.trim();
                    const password = document.getElementById('newPassword').value.trim();
                    const team = document.getElementById('newTeam').value;

                    if (State.users.some(u => String(u.username).trim() === username)) {
                        alert('Username / Emp ID already exists!');
                        return;
                    }

                    State.users.push({ id: Date.now(), name, username, password, role: 'agent', team, active: true });
                    State.targets[username] = 50000;
                    saveState();
                    alert('Agent created successfully!');
                    render();
                });
            }

            const adminReportForm = document.getElementById('adminReportForm');
            if (adminReportForm) {
                adminReportForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('adminAgentUsername').value;
                    const dateVal = document.getElementById('adminReportDate').value;
                    const leads = parseInt(document.getElementById('adminLeads').value) || 0;
                    const orders = parseInt(document.getElementById('adminOrders').value) || 0;
                    const amount = parseFloat(document.getElementById('adminAmount').value) || 0;

                    const agent = State.users.find(u => u.username === username);
                    if (!agent) return;

                    const formattedDate = new Date(dateVal).toLocaleDateString();

                    State.reports.push({
                        username: agent.username,
                        name: agent.name,
                        team: agent.team,
                        leads,
                        orders,
                        amount,
                        date: formattedDate
                    });
                    saveState();
                    alert('Manual report added successfully!');
                    render();
                });
            }
        }

        window.updateAgentTarget = function(username) {
            if (State.currentUser.role === 'supervisor') return;
            const val = parseFloat(document.getElementById(`target_${username}`).value) || 0;
            State.targets[username] = val;
            saveState();
            alert('Target updated successfully to ৳' + val.toLocaleString() + ' and synced globally!');
            render();
        }

        window.editUserPrompt = function(id) {
            if (State.currentUser.role === 'supervisor') return;
            const user = State.users.find(u => u.id === id);
            if (!user) return;
            const newName = prompt('Edit Agent Full Name:', user.name);
            const newUsername = prompt('Edit Emp ID:', user.username);
            const newPass = prompt('Edit Password:', user.password);
            const newTeam = prompt('Edit Team (Team Nazim / Team Abdus Samad):', user.team);
            if (newName) user.name = newName.trim();
            if (newUsername) user.username = newUsername.trim();
            if (newPass) user.password = newPass.trim();
            if (newTeam) user.team = newTeam.trim();
            saveState();
            render();
        }

        window.deleteUser = function(id) {
            if (State.currentUser.role === 'supervisor') return;
            if (confirm('Are you sure you want to delete this agent?')) {
                State.users = State.users.filter(u => u.id !== id);
                saveState();
                render();
            }
        }

        window.deleteReport = function(index) {
            if (confirm('Are you sure you want to delete this report?')) {
                State.reports.splice(index, 1);
                saveState();
                render();
            }
        }

        window.editReportPrompt = function(index) {
            const r = State.reports[index];
            if (!r) return;
            const newLeads = prompt('Edit Leads:', r.leads);
            const newOrders = prompt('Edit Orders:', r.orders);
            const newAmount = prompt('Edit Sales Amount (BDT):', r.amount);
            if (newLeads !== null) r.leads = parseInt(newLeads) || 0;
            if (newOrders !== null) r.orders = parseInt(newOrders) || 0;
            if (newAmount !== null) r.amount = parseFloat(newAmount) || 0;
            saveState();
            alert('Report updated successfully!');
            render();
        }

        window.adminForceLogout = function(index) {
            if (State.currentUser.role === 'supervisor') return;
            if (confirm('Force close this agent shift?')) {
                State.attendance[index].logoutTime = new Date().toLocaleTimeString();
                State.attendance[index].onBreak = false;
                saveState();
                render();
            }
        }

        window.deleteAttendance = function(index) {
            if (State.currentUser.role === 'supervisor') return;
            if (confirm('Are you sure you want to delete this attendance log?')) {
                State.attendance.splice(index, 1);
                saveState();
                render();
            }
        }

        function renderAgentDashboard() {
            const activeAttendance = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            const myTarget = State.targets[State.currentUser.username] || 50000;
            const myReports = State.reports.filter(r => r.username === State.currentUser.username);
            const totalSales = myReports.reduce((sum, r) => sum + (r.amount || 0), 0);
            const totalLeads = myReports.reduce((sum, r) => sum + (r.leads || 0), 0);
            const totalOrders = myReports.reduce((sum, r) => sum + (r.orders || 0), 0);
            const myConversion = totalLeads > 0 ? ((totalOrders / totalLeads) * 100).toFixed(1) : 0;
            const achievementRate = myTarget > 0 ? Math.min(Math.round((totalSales / myTarget) * 100), 100) : 0;

            const agents = State.users.filter(u => u.role === 'agent' && u.active !== false);
            const leaderboard = agents.map(agent => {
                const agentReports = State.reports.filter(r => r.username === agent.username);
                const salesAmount = agentReports.reduce((sum, r) => sum + (r.amount || 0), 0);
                const leads = agentReports.reduce((sum, r) => sum + (r.leads || 0), 0);
                const orders = agentReports.reduce((sum, r) => sum + (r.orders || 0), 0);
                const conversion = leads > 0 ? ((orders / leads) * 100).toFixed(1) : 0;
                const target = State.targets[agent.username] || 50000;
                const ratio = target > 0 ? Math.min(Math.round((salesAmount / target) * 100), 100) : 0;
                return { name: agent.name, username: agent.username, team: agent.team, salesAmount, leads, orders, conversion, target, ratio };
            }).sort((a, b) => b.salesAmount - a.salesAmount);

            const teamsMap = {};
            agents.forEach(agent => {
                if (!teamsMap[agent.team]) {
                    teamsMap[agent.team] = { teamName: agent.team, totalSales: 0, totalTarget: 0, agentsCount: 0 };
                }
                teamsMap[agent.team].agentsCount += 1;
                teamsMap[agent.team].totalTarget += (State.targets[agent.username] || 50000);
                const agentSales = State.reports.filter(r => r.username === agent.username).reduce((sum, r) => sum + (r.amount || 0), 0);
                teamsMap[agent.team].totalSales += agentSales;
            });
            const teamComparison = Object.values(teamsMap).sort((a, b) => b.totalSales - a.totalSales);

            return `
                <nav class="bg-slate-900 text-white px-6 py-3.5 flex justify-between items-center shadow">
                    <div class="flex items-center gap-3">
                        <div class="bg-orange-500 text-white px-3 py-1.5 rounded-lg font-bold text-sm tracking-wider">
                            GHORER BAZAR
                        </div>
                        <span class="text-xs text-slate-400">Agent Portal</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="bg-slate-800 px-3 py-1 rounded-lg text-xs font-mono text-orange-400 border border-slate-700">
                            🕒 <span id="liveClock">${new Date().toLocaleTimeString()}</span>
                        </div>
                        <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">Logout & End Shift</button>
                    </div>
                </nav>

                <div class="bg-white border-b border-slate-200 px-6 flex gap-2 overflow-x-auto shadow-sm">
                    <button onclick="setAgentTab('overview')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.agentTab === 'overview' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">📈 Month Overview & Submit</button>
                    <button onclick="setAgentTab('attendance')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.agentTab === 'attendance' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">⏱️ Shift & Break Portal</button>
                    <button onclick="setAgentTab('roster')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.agentTab === 'roster' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">📅 Duty Roster</button>
                    <button onclick="setAgentTab('leaderboard')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.agentTab === 'leaderboard' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">🏆 Team Leaderboard</button>
                </div>

                <div class="flex-grow p-6 max-w-5xl mx-auto w-full space-y-6 bg-slate-100">
                    
                    <div class="${State.agentTab === 'overview' ? '' : 'hidden'} space-y-6">
                        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold">Welcome, ${State.currentUser.name}!</h2>
                                <p class="text-xs text-slate-400 mt-1">Team: ${State.currentUser.team} | Emp ID: ${State.currentUser.username}</p>
                            </div>
                            <div class="bg-slate-800 px-4 py-2 rounded-xl text-xs text-orange-400 border border-slate-700 font-semibold">
                                📅 Month Performance Overview
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-slate-700">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Month Target</p>
                                <h3 class="text-xl font-bold text-slate-900 mt-1">৳${myTarget.toLocaleString()}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-orange-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Sales Achieved</p>
                                <h3 class="text-xl font-bold text-orange-600 mt-1">৳${totalSales.toLocaleString()} (${achievementRate}%)</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-blue-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Leads / Orders</p>
                                <h3 class="text-xl font-bold text-slate-900 mt-1">${totalLeads} / ${totalOrders}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-purple-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Conversion Rate</p>
                                <h3 class="text-xl font-bold text-purple-600 mt-1">${myConversion}%</h3>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">Submit Daily Sales Report</h3>
                            <form id="reportForm" class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Total Leads</label>
                                        <input type="number" id="leads" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-900 text-sm focus:outline-none focus:border-orange-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Total Orders</label>
                                        <input type="number" id="orders" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-900 text-sm focus:outline-none focus:border-orange-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Sales Amount (BDT)</label>
                                        <input type="number" id="amount" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-900 text-sm focus:outline-none focus:border-orange-500" placeholder="e.g. 5000">
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition shadow-md text-sm">Submit Report & Complete</button>
                            </form>
                        </div>
                    </div>

                    <div class="${State.agentTab === 'attendance' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-8 text-center space-y-6 shadow-sm">
                            <h3 class="text-xl font-bold text-slate-900">Shift & Smart Break Portal</h3>
                            <p class="text-xs text-slate-500">Status: <span class="font-semibold ${activeAttendance ? (activeAttendance.onBreak ? 'text-amber-600' : 'text-emerald-600') : 'text-slate-400'}">${activeAttendance ? (activeAttendance.onBreak ? `On Break (${activeAttendance.breakReason})` : 'Active Duty') : 'Offline'}</span></p>
                            
                            ${activeAttendance && !activeAttendance.onBreak ? `
                                <div class="max-w-md mx-auto bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-4">
                                    <label class="block text-xs font-semibold uppercase text-slate-600 text-left">Select Break Reason</label>
                                    <select id="breakReasonSelect" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 text-sm focus:outline-none focus:border-orange-500">
                                        <option value="Lunch Break">Lunch Break</option>
                                        <option value="Prayer Break">Prayer Break</option>
                                        <option value="Personal Break">Personal Break</option>
                                        <option value="Washroom">Washroom</option>
                                    </select>
                                    <button onclick="takeBreak()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-lg shadow transition text-sm">Take Break</button>
                                </div>
                            ` : ''}

                            ${activeAttendance && activeAttendance.onBreak ? `
                                <div class="max-w-md mx-auto bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-4">
                                    <p class="text-amber-600 font-medium text-sm">You are currently on break: <span class="underline">${activeAttendance.breakReason}</span></p>
                                    <button onclick="resumeWork()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition text-sm">Resume Work / Start Shift</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <div class="${State.agentTab === 'roster' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-2">📅 Duty Roster (November)</h3>
                            <p class="text-xs text-slate-500 mb-6">Your team's scheduled shifts and weekly off days (DO).</p>
                            ${renderRosterHTML(false)}
                        </div>
                    </div>

                    <div class="${State.agentTab === 'leaderboard' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">📊 Team-wise Comparison & Targets</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${teamComparison.map(t => {
                                    const teamRatio = t.totalTarget > 0 ? Math.min(Math.round((t.totalSales / t.totalTarget) * 100), 100) : 0;
                                    return `
                                        <div class="bg-slate-50 border border-slate-200 p-5 rounded-xl shadow-sm">
                                            <div class="flex justify-between items-center mb-2">
                                                <h4 class="font-bold text-base text-slate-900">${t.teamName}</h4>
                                                <span class="text-xs bg-orange-100 text-orange-600 px-2.5 py-1 rounded-full font-semibold">${t.agentsCount} Agents</span>
                                            </div>
                                            <p class="text-sm text-slate-600 mb-2">Total Sales: <span class="font-bold text-orange-600">৳${t.totalSales.toLocaleString()}</span> / Total Target: <span class="font-semibold text-slate-900">৳${t.totalTarget.toLocaleString()}</span></p>
                                            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                                                <div class="bg-orange-500 h-2.5 rounded-full" style="width: ${teamRatio}%"></div>
                                            </div>
                                            <span class="text-xs text-slate-500 mt-1 block">${teamRatio}% team target achieved</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">🏆 Agent Leaderboard & Ranking</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Rank</th>
                                            <th class="p-3">Agent Name</th>
                                            <th class="p-3">Team</th>
                                            <th class="p-3">Leads</th>
                                            <th class="p-3">Orders</th>
                                            <th class="p-3">Conversion</th>
                                            <th class="p-3">Sales Amount (BDT)</th>
                                            <th class="p-3">Achievement Ratio</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${leaderboard.map((item, idx) => `
                                            <tr class="${item.username === State.currentUser.username ? 'bg-orange-50 font-semibold' : ''}">
                                                <td class="p-3 text-slate-900">${idx === 0 ? '🥇 1st' : idx === 1 ? '🥈 2nd' : idx === 2 ? '🥉 3rd' : `#${idx + 1}`}</td>
                                                <td class="p-3 text-slate-900">${item.name} ${item.username === State.currentUser.username ? '<span class="text-xs bg-orange-500 text-white px-2 py-0.5 rounded ml-1">You</span>' : ''}</td>
                                                <td class="p-3 text-slate-500">${item.team}</td>
                                                <td class="p-3 text-slate-800 font-semibold">${item.leads}</td>
                                                <td class="p-3 text-slate-800 font-semibold">${item.orders}</td>
                                                <td class="p-3 text-blue-600 font-semibold">${item.conversion}%</td>
                                                <td class="p-3 text-orange-600 font-bold">৳${item.salesAmount.toLocaleString()} / ৳${item.target.toLocaleString()}</td>
                                                <td class="p-3 w-40">
                                                    <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                                                        <div class="bg-orange-500 h-2.5 rounded-full" style="width: ${item.ratio}%"></div>
                                                    </div>
                                                    <span class="text-xs text-slate-500 mt-1 block">${item.ratio}% achieved</span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        window.setAgentTab = function(tabName) {
            State.agentTab = tabName;
            saveState();
            render();
        }

        window.takeBreak = function() {
            const selectEl = document.getElementById('breakReasonSelect');
            const reason = selectEl ? selectEl.value : 'Personal Break';
            const att = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            if (att) {
                att.onBreak = true;
                att.breakReason = reason;
                saveState();
                render();
            }
        }

        window.resumeWork = function() {
            const att = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            if (att) {
                att.onBreak = false;
                att.breakReason = '';
                saveState();
                render();
            }
        }

        function attachAgentEvents() {
            const form = document.getElementById('reportForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const leads = parseInt(document.getElementById('leads').value) || 0;
                    const orders = parseInt(document.getElementById('orders').value) || 0;
                    const amount = parseFloat(document.getElementById('amount').value) || 0;
                    
                    State.reports.push({
                        username: State.currentUser.username,
                        name: State.currentUser.name,
                        team: State.currentUser.team,
                        leads,
                        orders,
                        amount,
                        date: new Date().toLocaleDateString()
                    });
                    saveState();
                    alert('Report submitted successfully and synced globally!');
                    render();
                });
            }
        }

        window.logout = function() {
            const att = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            if (att) {
                att.logoutTime = new Date().toLocaleTimeString();
                att.onBreak = false;
            }
            State.currentUser = null;
            saveState();
            render();
        }

        render();
    </script>
</body>
</html>
