<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhorerBazar Sales Performance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col"></div>

    <script>
        const State = {
            currentUser: JSON.parse(localStorage.getItem('gb_current_user')) || null,
            users: JSON.parse(localStorage.getItem('gb_users')) || [
                { id: 1, name: 'Admin User', username: 'admin', password: 'admin123', role: 'admin', team: 'Management' }
            ],
            attendance: JSON.parse(localStorage.getItem('gb_attendance')) || [],
            reports: JSON.parse(localStorage.getItem('gb_reports')) || [],
            targets: JSON.parse(localStorage.getItem('gb_targets')) || {},
            adminTab: 'overview',
            adminViewMode: 'month', // 'month' or 'today'
            agentTab: 'overview'
        };

        function saveState() {
            localStorage.setItem('gb_current_user', JSON.stringify(State.currentUser));
            localStorage.setItem('gb_users', JSON.stringify(State.users));
            localStorage.setItem('gb_attendance', JSON.stringify(State.attendance));
            localStorage.setItem('gb_reports', JSON.stringify(State.reports));
            localStorage.setItem('gb_targets', JSON.stringify(State.targets));
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!State.currentUser) {
                app.innerHTML = renderLogin();
                attachLoginEvents();
            } else if (State.currentUser.role === 'admin') {
                app.innerHTML = renderAdminDashboard();
                attachAdminEvents();
            } else {
                app.innerHTML = renderAgentDashboard();
                attachAgentEvents();
            }
        }

        function renderLogin() {
            return `
                <div class="flex-grow flex items-center justify-center p-4 bg-slate-100">
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-xl w-full max-w-md p-8">
                        <div class="text-center mb-8">
                            <div class="inline-flex bg-orange-500 text-white p-3.5 rounded-xl shadow-md mb-4 items-center justify-center font-bold text-xl">
                                GB
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">GhorerBazar</h1>
                            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider">Sales Performance Portal</p>
                        </div>
                        <form id="loginForm" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Username</label>
                                <input type="text" id="username" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-slate-900 focus:outline-none focus:border-orange-500" placeholder="Enter username">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Password</label>
                                <input type="password" id="password" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-slate-900 focus:outline-none focus:border-orange-500" placeholder="Enter password">
                            </div>
                            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition shadow-md">
                                Sign In &rarr;
                            </button>
                        </form>
                        <div id="loginError" class="mt-4 text-red-500 text-center text-sm hidden"></div>
                    </div>
                </div>
            `;
        }

        function attachLoginEvents() {
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value.trim();
                const found = State.users.find(x => x.username === u && x.password === p);
                if (found) {
                    State.currentUser = found;
                    saveState();
                    render();
                } else {
                    const err = document.getElementById('loginError');
                    err.textContent = 'Invalid username or password!';
                    err.classList.remove('hidden');
                }
            });
        }

        function renderAdminDashboard() {
            const activeAttendance = State.attendance.filter(a => !a.logoutTime);
            const agents = State.users.filter(u => u.role === 'agent');
            const todayStr = new Date().toLocaleDateString();

            const filteredReports = State.reports.filter(r => {
                if (State.adminViewMode === 'today') return r.date === todayStr;
                return true;
            });

            const totalSalesAll = filteredReports.reduce((sum, r) => sum + (r.amount || 0), 0);
            const totalOrdersAll = filteredReports.reduce((sum, r) => sum + (r.orders || 0), 0);
            const totalLeadsAll = filteredReports.reduce((sum, r) => sum + (r.leads || 0), 0);

            const agentStats = agents.map(agent => {
                const agentReports = filteredReports.filter(r => r.username === agent.username);
                const salesAmount = agentReports.reduce((sum, r) => sum + (r.amount || 0), 0);
                const leads = agentReports.reduce((sum, r) => sum + (r.leads || 0), 0);
                const orders = agentReports.reduce((sum, r) => sum + (r.orders || 0), 0);
                const target = State.targets[agent.username] || 50000;
                const ratio = target > 0 ? Math.min(Math.round((salesAmount / target) * 100), 100) : 0;
                return { name: agent.name, username: agent.username, team: agent.team, salesAmount, leads, orders, target, ratio };
            }).sort((a, b) => b.salesAmount - a.salesAmount);

            const teamsMap = {};
            agents.forEach(agent => {
                if (!teamsMap[agent.team]) {
                    teamsMap[agent.team] = { teamName: agent.team, totalSales: 0, totalTarget: 0, agentsCount: 0 };
                }
                teamsMap[agent.team].agentsCount += 1;
                teamsMap[agent.team].totalTarget += (State.targets[agent.username] || 50000);
                const agentSales = filteredReports.filter(r => r.username === agent.username).reduce((sum, r) => sum + (r.amount || 0), 0);
                teamsMap[agent.team].totalSales += agentSales;
            });
            const teamComparison = Object.values(teamsMap).sort((a, b) => b.totalSales - a.totalSales);

            return `
                <!-- Top Header -->
                <nav class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shadow">
                    <div class="flex items-center gap-3">
                        <div class="bg-orange-500 text-white px-3 py-1.5 rounded font-bold text-sm tracking-wider">
                            GHORER BAZAR
                        </div>
                        <span class="text-xs text-slate-400">Admin Control Panel</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded text-xs font-semibold border border-slate-700">📥 Backup</button>
                        <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded text-xs font-semibold border border-slate-700 cursor-pointer">
                            📤 Restore <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                        </label>
                        <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded text-xs font-semibold">Logout</button>
                    </div>
                </nav>

                <!-- Navigation Tabs Bar -->
                <div class="bg-white border-b border-slate-200 px-6 flex gap-4 shadow-sm">
                    <button onclick="setAdminTab('overview')" class="py-3 px-4 font-semibold text-sm border-b-2 transition ${State.adminTab === 'overview' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">📊 Sales Overview</button>
                    <button onclick="setAdminTab('agents')" class="py-3 px-4 font-semibold text-sm border-b-2 transition ${State.adminTab === 'agents' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">👥 Agent Management</button>
                    <button onclick="setAdminTab('reports')" class="py-3 px-4 font-semibold text-sm border-b-2 transition ${State.adminTab === 'reports' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">📝 Manual Report Entry</button>
                    <button onclick="setAdminTab('leaderboard')" class="py-3 px-4 font-semibold text-sm border-b-2 transition ${State.adminTab === 'leaderboard' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">🏆 Leaderboard & Rankings</button>
                </div>

                <div class="flex-grow p-6 max-w-7xl mx-auto w-full space-y-6">
                    
                    <!-- TAB 1: OVERVIEW -->
                    <div class="${State.adminTab === 'overview' ? '' : 'hidden'} space-y-6">
                        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h2 class="text-xl font-bold">Welcome, ${State.currentUser.name}!</h2>
                                <p class="text-xs text-slate-400 mt-1">Sales performance overview & team analytics.</p>
                            </div>
                            <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-xl border border-slate-700">
                                <button onclick="setAdminViewMode('month')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${State.adminViewMode === 'month' ? 'bg-orange-500 text-white' : 'text-slate-300'}">Month-wise</button>
                                <button onclick="setAdminViewMode('today')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${State.adminViewMode === 'today' ? 'bg-orange-500 text-white' : 'text-slate-300'}">Today's View</button>
                            </div>
                        </div>

                        <!-- Clean KPI Cards (Only Leads, Orders, Amount) -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-orange-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Sales Amount</p>
                                <h3 class="text-2xl font-bold text-orange-600 mt-1">৳${totalSalesAll.toLocaleString()}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-blue-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Orders</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">${totalOrdersAll}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-purple-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Leads</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">${totalLeadsAll}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-emerald-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Agents Online</p>
                                <h3 class="text-2xl font-bold text-emerald-600 mt-1">${activeAttendance.length} / ${agents.length}</h3>
                            </div>
                        </div>

                        <!-- Team-wise Comparison -->
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">📊 Team-wise Comparison & Performance</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${teamComparison.map(t => `
                                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl shadow-sm">
                                        <div class="flex justify-between items-center mb-1">
                                            <h4 class="font-bold text-slate-900">${t.teamName}</h4>
                                            <span class="text-xs bg-orange-100 text-orange-600 px-2.5 py-0.5 rounded-full font-semibold">${t.agentsCount} Agents</span>
                                        </div>
                                        <p class="text-sm text-slate-500">Sales: <span class="font-bold text-orange-600">৳${t.totalSales.toLocaleString()}</span> / Target: ৳${t.totalTarget.toLocaleString()}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- TAB 2: AGENT MANAGEMENT -->
                    <div class="${State.adminTab === 'agents' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">Create New Agent Account</h3>
                            <form id="createAgentForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                                <input type="text" id="newName" placeholder="Agent Full Name" required class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                <input type="text" id="newUsername" placeholder="Username" required class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                <input type="text" id="newPassword" placeholder="Password" required class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                <select id="newTeam" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                    <option value="Team Nazim">Team Nazim</option>
                                    <option value="Team Abdus Samad">Team Abdus Samad</option>
                                </select>
                                <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-lg transition shadow-sm text-sm">Add Agent</button>
                            </form>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">Manage Agents & Individual Targets (BDT)</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Name</th>
                                            <th class="p-3">Username</th>
                                            <th class="p-3">Team</th>
                                            <th class="p-3">Target Amount (BDT)</th>
                                            <th class="p-3">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${agents.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-slate-400">No agents found.</td></tr>` : 
                                        agents.map(u => `
                                            <tr>
                                                <td class="p-3 font-medium text-slate-900">${u.name}</td>
                                                <td class="p-3 text-slate-600">${u.username}</td>
                                                <td class="p-3"><span class="bg-slate-100 text-slate-800 px-2 py-1 rounded text-xs font-semibold">${u.team}</span></td>
                                                <td class="p-3">
                                                    <div class="flex items-center gap-2">
                                                        <input type="number" id="target_${u.username}" value="${State.targets[u.username] || 50000}" class="bg-slate-50 border border-slate-300 rounded px-2 py-1 w-32 text-slate-900 text-sm">
                                                        <button onclick="updateAgentTarget('${u.username}')" class="bg-orange-500 hover:bg-orange-600 text-white px-2.5 py-1 rounded text-xs font-semibold">Set</button>
                                                    </div>
                                                </td>
                                                <td class="p-3 flex gap-2">
                                                    <button onclick="editUserPrompt(${u.id})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold">Edit</button>
                                                    <button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: MANUAL REPORT ENTRY -->
                    <div class="${State.adminTab === 'reports' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">📝 Manual Report Entry (Admin Override)</h3>
                            <form id="adminReportForm" class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Select Agent</label>
                                    <select id="adminAgentUsername" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                        <option value="">Choose Agent</option>
                                        ${agents.map(a => `<option value="${a.username}">${a.name} (${a.team})</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Date</label>
                                    <input type="date" id="adminReportDate" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Leads</label>
                                    <input type="number" id="adminLeads" placeholder="Leads" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Orders</label>
                                    <input type="number" id="adminOrders" placeholder="Orders" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Amount (BDT)</label>
                                    <input type="number" id="adminAmount" placeholder="Amount" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                </div>
                                <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-lg transition shadow-sm text-sm">Add Report</button>
                            </form>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">All Submitted Reports</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Date</th>
                                            <th class="p-3">Agent Name</th>
                                            <th class="p-3">Team</th>
                                            <th class="p-3">Leads</th>
                                            <th class="p-3">Orders</th>
                                            <th class="p-3">Amount (BDT)</th>
                                            <th class="p-3">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${State.reports.length === 0 ? `<tr><td colspan="7" class="p-4 text-center text-slate-400">No reports submitted yet.</td></tr>` :
                                        State.reports.map((r, idx) => `
                                            <tr>
                                                <td class="p-3">${r.date}</td>
                                                <td class="p-3 font-medium text-slate-900">${r.name}</td>
                                                <td class="p-3">${r.team}</td>
                                                <td class="p-3">${r.leads}</td>
                                                <td class="p-3">${r.orders}</td>
                                                <td class="p-3 font-semibold text-orange-600">৳${(r.amount || 0).toLocaleString()}</td>
                                                <td class="p-3">
                                                    <button onclick="deleteReport(${idx})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: LEADERBOARD -->
                    <div class="${State.adminTab === 'leaderboard' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">🏆 Agent Leaderboard & Rankings</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Rank</th>
                                            <th class="p-3">Name</th>
                                            <th class="p-3">Team</th>
                                            <th class="p-3">Sales Amount (BDT)</th>
                                            <th class="p-3">Achievement Ratio</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${agentStats.map((item, idx) => `
                                            <tr>
                                                <td class="p-3 font-bold text-base">${idx === 0 ? '🥇 1st' : idx === 1 ? '🥈 2nd' : idx === 2 ? '🥉 3rd' : `#${idx+1}`}</td>
                                                <td class="p-3 font-medium text-slate-900">${item.name}</td>
                                                <td class="p-3 text-slate-500">${item.team}</td>
                                                <td class="p-3 text-orange-600 font-bold">৳${item.salesAmount.toLocaleString()} / ৳${item.target.toLocaleString()}</td>
                                                <td class="p-3 w-48">
                                                    <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                                                        <div class="bg-orange-500 h-2.5 rounded-full" style="width: ${item.ratio}%"></div>
                                                    </div>
                                                    <span class="text-xs text-slate-500 mt-1 block">${item.ratio}% achieved</span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        window.setAdminTab = function(tabName) {
            State.adminTab = tabName;
            render();
        }

        window.setAdminViewMode = function(mode) {
            State.adminViewMode = mode;
            render();
        }

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(State));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "ghorerbazar_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.importData = function(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.users && parsed.reports) {
                            State.users = parsed.users;
                            State.reports = parsed.reports;
                            State.attendance = parsed.attendance || [];
                            State.targets = parsed.targets || {};
                            saveState();
                            alert('Data restored successfully!');
                            render();
                        } else {
                            alert('Invalid backup file format!');
                        }
                    } catch (err) {
                        alert('Error parsing JSON file!');
                    }
                };
            }
        }

        function attachAdminEvents() {
            const form = document.getElementById('createAgentForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('newName').value.trim();
                    const username = document.getElementById('newUsername').value.trim();
                    const password = document.getElementById('newPassword').value.trim();
                    const team = document.getElementById('newTeam').value;

                    if (State.users.some(u => u.username === username)) {
                        alert('Username already exists!');
                        return;
                    }

                    State.users.push({ id: Date.now(), name, username, password, role: 'agent', team });
                    State.targets[username] = 50000;
                    saveState();
                    render();
                });
            }

            const adminReportForm = document.getElementById('adminReportForm');
            if (adminReportForm) {
                adminReportForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('adminAgentUsername').value;
                    const dateVal = document.getElementById('adminReportDate').value;
                    const leads = parseInt(document.getElementById('adminLeads').value) || 0;
                    const orders = parseInt(document.getElementById('adminOrders').value) || 0;
                    const amount = parseFloat(document.getElementById('adminAmount').value) || 0;

                    const agent = State.users.find(u => u.username === username);
                    if (!agent) return;

                    const formattedDate = new Date(dateVal).toLocaleDateString();

                    State.reports.push({
                        username: agent.username,
                        name: agent.name,
                        team: agent.team,
                        leads,
                        orders,
                        amount,
                        date: formattedDate
                    });
                    saveState();
                    alert('Manual report added successfully!');
                    render();
                });
            }
        }

        window.updateAgentTarget = function(username) {
            const val = parseFloat(document.getElementById(`target_${username}`).value) || 0;
            State.targets[username] = val;
            saveState();
            alert('Target updated successfully!');
        }

        window.editUserPrompt = function(id) {
            const user = State.users.find(u => u.id === id);
            if (!user) return;
            const newName = prompt('Edit Agent Full Name:', user.name);
            const newUsername = prompt('Edit Username:', user.username);
            const newPass = prompt('Edit Password:', user.password);
            const newTeam = prompt('Edit Team (Team Nazim / Team Abdus Samad):', user.team);
            if (newName) user.name = newName.trim();
            if (newUsername) user.username = newUsername.trim();
            if (newPass) user.password = newPass.trim();
            if (newTeam) user.team = newTeam.trim();
            saveState();
            render();
        }

        window.deleteUser = function(id) {
            if (confirm('Are you sure you want to delete this agent?')) {
                State.users = State.users.filter(u => u.id !== id);
                saveState();
                render();
            }
        }

        window.deleteReport = function(index) {
            if (confirm('Are you sure you want to delete this report?')) {
                State.reports.splice(index, 1);
                saveState();
                render();
            }
        }

        function renderAgentDashboard() {
            const activeAttendance = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            const myTarget = State.targets[State.currentUser.username] || 50000;
            const myReports = State.reports.filter(r => r.username === State.currentUser.username);
            const totalSales = myReports.reduce((sum, r) => sum + (r.amount || 0), 0);
            const achievementRate = myTarget > 0 ? Math.min(Math.round((totalSales / myTarget) * 100), 100) : 0;

            const agents = State.users.filter(u => u.role === 'agent');
            const leaderboard = agents.map(agent => {
                const agentReports = State.reports.filter(r => r.username === agent.username);
                const salesAmount = agentReports.reduce((sum, r) => sum + (r.amount || 0), 0);
                const target = State.targets[agent.username] || 50000;
                const ratio = target > 0 ? Math.min(Math.round((salesAmount / target) * 100), 100) : 0;
                return { name: agent.name, username: agent.username, team: agent.team, salesAmount, target, ratio };
            }).sort((a, b) => b.salesAmount - a.salesAmount);

            const teamsMap = {};
            agents.forEach(agent => {
                if (!teamsMap[agent.team]) {
                    teamsMap[agent.team] = { teamName: agent.team, totalSales: 0, totalTarget: 0, agentsCount: 0 };
                }
                teamsMap[agent.team].agentsCount += 1;
                teamsMap[agent.team].totalTarget += (State.targets[agent.username] || 50000);
                const agentSales = State.reports.filter(r => r.username === agent.username).reduce((sum, r) => sum + (r.amount || 0), 0);
                teamsMap[agent.team].totalSales += agentSales;
            });
            const teamComparison = Object.values(teamsMap).sort((a, b) => b.totalSales - a.totalSales);

            return `
                <nav class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shadow">
                    <div class="flex items-center gap-3">
                        <div class="bg-orange-500 text-white px-3 py-1.5 rounded font-bold text-sm tracking-wider">
                            GHORER BAZAR
                        </div>
                        <span class="text-xs text-slate-400">Agent Portal</span>
                    </div>
                    <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded text-xs font-semibold">Logout</button>
                </nav>

                <!-- Agent Tabs Bar -->
                <div class="bg-white border-b border-slate-200 px-6 flex gap-4 shadow-sm">
                    <button onclick="setAgentTab('overview')" class="py-3 px-4 font-semibold text-sm border-b-2 transition ${State.agentTab === 'overview' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">📈 Month Overview & Submit</button>
                    <button onclick="setAgentTab('attendance')" class="py-3 px-4 font-semibold text-sm border-b-2 transition ${State.agentTab === 'attendance' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">⏱️ Shift & Attendance</button>
                    <button onclick="setAgentTab('leaderboard')" class="py-3 px-4 font-semibold text-sm border-b-2 transition ${State.agentTab === 'leaderboard' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">🏆 Team Leaderboard</button>
                </div>

                <div class="flex-grow p-6 max-w-5xl mx-auto w-full space-y-6">
                    
                    <!-- AGENT TAB 1: OVERVIEW & SUBMIT -->
                    <div class="${State.agentTab === 'overview' ? '' : 'hidden'} space-y-6">
                        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold">Welcome, ${State.currentUser.name}!</h2>
                                <p class="text-xs text-slate-400 mt-1">Team: ${State.currentUser.team}</p>
                            </div>
                            <div class="bg-slate-800 px-4 py-2 rounded-xl text-xs text-slate-300">
                                📅 Month Performance Overview
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm border-l-4 border-l-slate-700">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Your Month Target Amount</p>
                                <h3 class="text-3xl font-bold text-slate-900 mt-1">৳${myTarget.toLocaleString()}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm border-l-4 border-l-orange-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Month Sales Achieved</p>
                                <h3 class="text-3xl font-bold text-orange-500 mt-1">৳${totalSales.toLocaleString()} (${achievementRate}%)</h3>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">Submit Daily Sales Report</h3>
                            <form id="reportForm" class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Total Leads</label>
                                        <input type="number" id="leads" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-900 text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Total Orders</label>
                                        <input type="number" id="orders" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-900 text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Sales Amount (BDT)</label>
                                        <input type="number" id="amount" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-900 text-sm" placeholder="e.g. 5000">
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-lg transition shadow-md text-sm">Submit Report</button>
                            </form>
                        </div>
                    </div>

                    <!-- AGENT TAB 2: ATTENDANCE -->
                    <div class="${State.agentTab === 'attendance' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-8 text-center space-y-4 shadow-sm">
                            <h3 class="text-xl font-bold text-slate-900">Shift & Attendance Portal</h3>
                            <div class="flex justify-center gap-4">
                                ${!activeAttendance ? `
                                    <button onclick="startShift()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-3 rounded-lg shadow-md transition text-sm">Start Shift</button>
                                ` : `
                                    <button onclick="endShift()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-lg shadow-md transition text-sm">End Shift</button>
                                    <button onclick="toggleBreak()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-lg shadow-md transition text-sm">${activeAttendance.onBreak ? 'Resume Work' : 'Take Break'}</button>
                                `}
                            </div>
                            <p class="text-sm text-slate-500">Status: <span class="font-semibold ${activeAttendance ? 'text-orange-500' : 'text-slate-400'}">${activeAttendance ? (activeAttendance.onBreak ? 'On Break' : 'Active Duty') : 'Offline'}</span></p>
                        </div>
                    </div>

                    <!-- AGENT TAB 3: LEADERBOARD -->
                    <div class="${State.agentTab === 'leaderboard' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">📊 Team-wise Comparison</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${teamComparison.map(t => `
                                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl shadow-sm">
                                        <div class="flex justify-between items-center mb-2">
                                            <h4 class="font-bold text-slate-900">${t.teamName}</h4>
                                            <span class="text-xs bg-orange-100 text-orange-600 px-2.5 py-0.5 rounded-full font-semibold">${t.agentsCount} Agents</span>
                                        </div>
                                        <p class="text-sm text-slate-500">Sales: <span class="font-bold text-orange-600">৳${t.totalSales.toLocaleString()}</span> / Target: ৳${t.totalTarget.toLocaleString()}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">🏆 Agent Leaderboard & Ranking</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Rank</th>
                                            <th class="p-3">Agent Name</th>
                                            <th class="p-3">Team</th>
                                            <th class="p-3">Sales Amount (BDT)</th>
                                            <th class="p-3">Achievement Ratio</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${leaderboard.map((item, idx) => `
                                            <tr class="${item.username === State.currentUser.username ? 'bg-orange-50 font-semibold' : ''}">
                                                <td class="p-3">${idx === 0 ? '🥇 1st' : idx === 1 ? '🥈 2nd' : idx === 2 ? '🥉 3rd' : `#${idx + 1}`}</td>
                                                <td class="p-3 text-slate-900">${item.name} ${item.username === State.currentUser.username ? '<span class="text-xs bg-orange-500 text-white px-2 py-0.5 rounded ml-1">You</span>' : ''}</td>
                                                <td class="p-3 text-slate-500">${item.team}</td>
                                                <td class="p-3 text-orange-600 font-bold">৳${item.salesAmount.toLocaleString()} / ৳${item.target.toLocaleString()}</td>
                                                <td class="p-3 w-48">
                                                    <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                                                        <div class="bg-orange-500 h-2.5 rounded-full" style="width: ${item.ratio}%"></div>
                                                    </div>
                                                    <span class="text-xs text-slate-500 mt-1 block">${item.ratio}% achieved</span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        window.setAgentTab = function(tabName) {
            State.agentTab = tabName;
            render();
        }

        function attachAgentEvents() {
            const form = document.getElementById('reportForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const leads = parseInt(document.getElementById('leads').value) || 0;
                    const orders = parseInt(document.getElementById('orders').value) || 0;
                    const amount = parseFloat(document.getElementById('amount').value) || 0;
                    
                    State.reports.push({
                        username: State.currentUser.username,
                        name: State.currentUser.name,
                        team: State.currentUser.team,
                        leads,
                        orders,
                        amount,
                        date: new Date().toLocaleDateString()
                    });
                    saveState();
                    alert('Report submitted successfully!');
                    render();
                });
            }
        }

        window.startShift = function() {
            State.attendance.push({
                username: State.currentUser.username,
                name: State.currentUser.name,
                team: State.currentUser.team,
                loginTime: new Date().toLocaleTimeString(),
                logoutTime: null,
                onBreak: false
            });
            saveState();
            render();
        }

        window.endShift = function() {
            const att = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            if (att) {
                att.logoutTime = new Date().toLocaleTimeString();
                att.onBreak = false;
                saveState();
                render();
            }
        }

        window.toggleBreak = function() {
            const att = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            if (att) {
                att.onBreak = !att.onBreak;
                saveState();
                render();
            }
        }

        window.logout = function() {
            State.currentUser = null;
            saveState();
            render();
        }

        render();
    </script>
</body>
</html>
