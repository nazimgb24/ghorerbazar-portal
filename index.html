<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhorerBazar Sales Performance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">

    <div id="app" class="flex-grow flex flex-col"></div>

    <script>
        let savedUsers = JSON.parse(localStorage.getItem('gb_portal_users_v5'));
        if (!savedUsers || !Array.isArray(savedUsers) || savedUsers.length === 0) {
            savedUsers = [
                { id: 1, name: 'Md. Nazimur Rahman', username: '10122', password: 'admin123', role: 'admin', team: 'Team Nazim', active: true },
                { id: 2, name: 'Md Abdus Samad', username: '10107', password: 'admin123', role: 'admin', team: 'Team Abdus Samad', active: true },
                { id: 3, name: 'Admin Master', username: 'admin', password: 'admin123', role: 'admin', team: 'Management', active: true },
                
                { id: 4, name: 'Habibur Rahman Shuvo', username: '10098', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                { id: 5, name: 'Al-Amin Kazi', username: '10136', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                { id: 6, name: 'Zubayer Al Mahmud', username: '11007', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                { id: 7, name: 'Md. Mehedi Amin', username: '11101', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                { id: 8, name: 'Abu Sayed', username: '11120', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                { id: 9, name: 'Rabbir Hossain Molla', username: '11130', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                { id: 10, name: 'Abdullah Al Soad', username: '10806', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                { id: 11, name: 'Al-Amin', username: '10128', password: '12345678', role: 'agent', team: 'Team Abdus Samad', active: true },
                
                { id: 12, name: 'Shagor Ahmed', username: '10191', password: '12345678', role: 'agent', team: 'Team Nazim', active: true },
                { id: 13, name: 'Abdullah Dipu', username: '10289', password: '12345678', role: 'agent', team: 'Team Nazim', active: true },
                { id: 14, name: 'Hasibul Islam Eraz', username: '11044', password: '12345678', role: 'agent', team: 'Team Nazim', active: true },
                { id: 15, name: 'Kamruzzaman Shujon', username: '10741', password: '12345678', role: 'agent', team: 'Team Nazim', active: true },
                { id: 16, name: 'Md. Abdullah Mahmud', username: '10803', password: '12345678', role: 'agent', team: 'Team Nazim', active: true },
                { id: 17, name: 'Md. Ashiqur Rahman', username: '11042', password: '12345678', role: 'agent', team: 'Team Nazim', active: true },
                { id: 18, name: 'Sheikh MD Rayhan', username: '10328', password: '12345678', role: 'agent', team: 'Team Nazim', active: true },
                { id: 19, name: 'Ranju Ahmed', username: '10135', password: '12345678', role: 'agent', team: 'Team Nazim', active: true }
            ];
        }

        const State = {
            currentUser: JSON.parse(localStorage.getItem('gb_portal_current_user_v5')) || null,
            users: savedUsers,
            attendance: JSON.parse(localStorage.getItem('gb_portal_attendance_v5')) || [],
            reports: JSON.parse(localStorage.getItem('gb_portal_reports_v5')) || [],
            targets: JSON.parse(localStorage.getItem('gb_portal_targets_v5')) || {},
            adminTab: 'overview',
            adminViewMode: 'month',
            agentTab: 'overview'
        };

        function saveState() {
            localStorage.setItem('gb_portal_current_user_v5', JSON.stringify(State.currentUser));
            localStorage.setItem('gb_portal_users_v5', JSON.stringify(State.users));
            localStorage.setItem('gb_portal_attendance_v5', JSON.stringify(State.attendance));
            localStorage.setItem('gb_portal_reports_v5', JSON.stringify(State.reports));
            localStorage.setItem('gb_portal_targets_v5', JSON.stringify(State.targets));
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!State.currentUser) {
                app.innerHTML = renderLogin();
                attachLoginEvents();
            } else if (State.currentUser.role === 'admin') {
                app.innerHTML = renderAdminDashboard();
                attachAdminEvents();
            } else {
                app.innerHTML = renderAgentDashboard();
                attachAgentEvents();
            }
        }

        function renderLogin() {
            return `
                <div class="flex-grow flex items-center justify-center p-4 bg-slate-100">
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-xl w-full max-w-md p-8 relative">
                        <div class="text-center mb-8">
                            <div class="inline-flex bg-orange-500 text-white p-3.5 rounded-2xl shadow-md mb-4 items-center justify-center font-bold text-xl tracking-wider">
                                GB
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">GhorerBazar</h1>
                            <p class="text-xs text-orange-600 mt-1 uppercase tracking-widest font-semibold">Sales Performance Portal</p>
                        </div>
                        <form id="loginForm" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Username (Emp ID)</label>
                                <input type="text" id="username" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-orange-500 transition text-sm" placeholder="Enter Emp ID">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Password</label>
                                <input type="password" id="password" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-orange-500 transition text-sm" placeholder="Enter password">
                            </div>
                            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-md text-sm">
                                Secure Sign In &rarr;
                            </button>
                        </form>
                        <div id="loginError" class="mt-4 text-red-500 text-center text-sm hidden font-medium"></div>
                    </div>
                </div>
            `;
        }

        function attachLoginEvents() {
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value.trim();
                
                const found = State.users.find(x => String(x.username).trim() === u && String(x.password).trim() === p);
                
                if (found) {
                    if (found.role === 'agent' && found.active === false) {
                        const err = document.getElementById('loginError');
                        err.textContent = 'Your account has been deactivated by Admin!';
                        err.classList.remove('hidden');
                        return;
                    }

                    State.currentUser = found;
                    if (found.role === 'agent') {
                        const active = State.attendance.find(a => a.username === found.username && !a.logoutTime);
                        if (!active) {
                            State.attendance.push({
                                username: found.username,
                                name: found.name,
                                team: found.team,
                                loginTime: new Date().toLocaleTimeString(),
                                logoutTime: null,
                                onBreak: false,
                                breakReason: ''
                            });
                        }
                    }
                    saveState();
                    render();
                } else {
                    const err = document.getElementById('loginError');
                    err.textContent = 'Invalid username or password!';
                    err.classList.remove('hidden');
                }
            });
        }

        function renderAdminDashboard() {
            const activeAttendance = State.attendance.filter(a => !a.logoutTime);
            const agents = State.users.filter(u => u.role === 'agent' && u.active !== false);
            const allAgents = State.users.filter(u => u.role === 'agent');
            const todayStr = new Date().toLocaleDateString();

            const filteredReports = State.reports.filter(r => {
                if (State.adminViewMode === 'today') return r.date === todayStr;
                return true;
            });

            const totalSalesAll = filteredReports.reduce((sum, r) => sum + (r.amount || 0), 0);
            const totalOrdersAll = filteredReports.reduce((sum, r) => sum + (r.orders || 0), 0);
            const totalLeadsAll = filteredReports.reduce((sum, r) => sum + (r.leads || 0), 0);

            const agentStats = agents.map(agent => {
                const agentReports = filteredReports.filter(r => r.username === agent.username);
                const salesAmount = agentReports.reduce((sum, r) => sum + (r.amount || 0), 0);
                const leads = agentReports.reduce((sum, r) => sum + (r.leads || 0), 0);
                const orders = agentReports.reduce((sum, r) => sum + (r.orders || 0), 0);
                const target = State.targets[agent.username] || 50000;
                const ratio = target > 0 ? Math.min(Math.round((salesAmount / target) * 100), 100) : 0;
                return { name: agent.name, username: agent.username, team: agent.team, salesAmount, leads, orders, target, ratio };
            }).sort((a, b) => b.salesAmount - a.salesAmount);

            const teamsMap = {};
            agents.forEach(agent => {
                if (!teamsMap[agent.team]) {
                    teamsMap[agent.team] = { teamName: agent.team, totalSales: 0, totalTarget: 0, agentsCount: 0 };
                }
                teamsMap[agent.team].agentsCount += 1;
                teamsMap[agent.team].totalTarget += (State.targets[agent.username] || 50000);
                const agentSales = filteredReports.filter(r => r.username === agent.username).reduce((sum, r) => sum + (r.amount || 0), 0);
                teamsMap[agent.team].totalSales += agentSales;
            });
            const teamComparison = Object.values(teamsMap).sort((a, b) => b.totalSales - a.totalSales);

            return `
                <nav class="bg-slate-900 text-white px-6 py-3.5 flex justify-between items-center shadow">
                    <div class="flex items-center gap-3">
                        <div class="bg-orange-500 text-white px-3 py-1.5 rounded-lg font-bold text-sm tracking-wider">
                            GHORER BAZAR
                        </div>
                        <span class="text-xs text-slate-400">Admin Control Center</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 transition">📥 Backup</button>
                        <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 cursor-pointer transition">
                            📤 Restore <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                        </label>
                        <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">Logout</button>
                    </div>
                </nav>

                <div class="bg-white border-b border-slate-200 px-6 flex gap-2 overflow-x-auto shadow-sm">
                    <button onclick="setAdminTab('overview')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.adminTab === 'overview' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">📊 Sales Overview</button>
                    <button onclick="setAdminTab('agents')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.adminTab === 'agents' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">👥 Agent Management</button>
                    <button onclick="setAdminTab('attendance')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.adminTab === 'attendance' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">⏱️ Attendance & Breaks</button>
                    <button onclick="setAdminTab('reports')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.adminTab === 'reports' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">📝 Manual Report Entry</button>
                    <button onclick="setAdminTab('leaderboard')" class="py-3 px-5 font-semibold text-sm border-b-2 transition ${State.adminTab === 'leaderboard' ? 'border-orange-500 text-orange-600' : 'border-transparent text-slate-600 hover:text-slate-900'}">🏆 Leaderboard</button>
                </div>

                <div class="flex-grow p-6 max-w-7xl mx-auto w-full space-y-6 bg-slate-100">
                    
                    <div class="${State.adminTab === 'overview' ? '' : 'hidden'} space-y-6">
                        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h2 class="text-xl font-bold">Welcome, ${State.currentUser.name}!</h2>
                                <p class="text-xs text-slate-400 mt-1">Real-time performance analytics.</p>
                            </div>
                            <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-xl border border-slate-700">
                                <button onclick="setAdminViewMode('month')" class="px-4 py-1.5 text-xs font-semibold rounded-lg transition ${State.adminViewMode === 'month' ? 'bg-orange-500 text-white' : 'text-slate-300'}">Month-wise</button>
                                <button onclick="setAdminViewMode('today')" class="px-4 py-1.5 text-xs font-semibold rounded-lg transition ${State.adminViewMode === 'today' ? 'bg-orange-500 text-white' : 'text-slate-300'}">Today's View</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-orange-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Sales Amount</p>
                                <h3 class="text-2xl font-bold text-orange-600 mt-1">৳${totalSalesAll.toLocaleString()}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-blue-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Orders</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">${totalOrdersAll}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-purple-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Total Leads</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">${totalLeadsAll}</h3>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm border-l-4 border-l-emerald-500">
                                <p class="text-slate-500 text-xs uppercase font-semibold">Active Agents Online</p>
                                <h3 class="text-2xl font-bold text-emerald-600 mt-1">${activeAttendance.length} / ${agents.length}</h3>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">📊 Team-wise Comparison & Performance</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${teamComparison.map(t => `
                                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl shadow-sm">
                                        <div class="flex justify-between items-center mb-1">
                                            <h4 class="font-bold text-slate-900">${t.teamName}</h4>
                                            <span class="text-xs bg-orange-100 text-orange-600 px-2.5 py-0.5 rounded-full font-semibold">${t.agentsCount} Agents</span>
                                        </div>
                                        <p class="text-sm text-slate-500">Sales: <span class="font-bold text-orange-600">৳${t.totalSales.toLocaleString()}</span> / Target: ৳${t.totalTarget.toLocaleString()}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="${State.adminTab === 'agents' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">Create New Agent Account</h3>
                            <form id="createAgentForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                                <input type="text" id="newName" placeholder="Agent Full Name" required class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                <input type="text" id="newUsername" placeholder="Emp ID (e.g. 11044)" required class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                <input type="text" id="newPassword" placeholder="Password (e.g. 12345678)" required class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                <select id="newTeam" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                    <option value="Team Nazim">Team Nazim</option>
                                    <option value="Team Abdus Samad">Team Abdus Samad</option>
                                </select>
                                <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-lg transition shadow-sm text-sm">Add Agent</button>
                            </form>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">Manage Agents, Status & Individual Targets (BDT)</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Name</th>
                                            <th class="p-3">Emp ID</th>
                                            <th class="p-3">Password</th>
                                            <th class="p-3">Team</th>
                                            <th class="p-3">Status (Active / Off)</th>
                                            <th class="p-3">Target Amount (BDT)</th>
                                            <th class="p-3">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${allAgents.length === 0 ? `<tr><td colspan="7" class="p-4 text-center text-slate-400">No agents found.</td></tr>` : 
                                        allAgents.map(u => `
                                            <tr>
                                                <td class="p-3 font-medium text-slate-900">${u.name}</td>
                                                <td class="p-3 text-slate-600 font-semibold">${u.username}</td>
                                                <td class="p-3 text-slate-500">${u.password}</td>
                                                <td class="p-3"><span class="bg-slate-100 text-slate-800 px-2 py-1 rounded text-xs font-semibold">${u.team}</span></td>
                                                <td class="p-3">
                                                    <button onclick="toggleAgentStatus(${u.id})" class="px-3 py-1 rounded-lg text-xs font-semibold transition ${u.active !== false ? 'bg-emerald-100 text-emerald-700 border border-emerald-300 hover:bg-emerald-200' : 'bg-red-100 text-red-700 border border-red-300 hover:bg-red-200'}">
                                                        ${u.active !== false ? '🟢 Active' : '🔴 Inactive (Off)'}
                                                    </button>
                                                </td>
                                                <td class="p-3">
                                                    <div class="flex items-center gap-2">
                                                        <input type="number" id="target_${u.username}" value="${State.targets[u.username] || 50000}" class="bg-slate-50 border border-slate-300 rounded px-2 py-1 w-28 text-slate-900 text-sm">
                                                        <button onclick="updateAgentTarget('${u.username}')" class="bg-orange-500 hover:bg-orange-600 text-white px-2.5 py-1 rounded text-xs font-semibold">Set</button>
                                                    </div>
                                                </td>
                                                <td class="p-3 flex gap-2">
                                                    <button onclick="editUserPrompt(${u.id})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold">Edit</button>
                                                    <button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="${State.adminTab === 'attendance' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">⏱️ Live Agent Attendance & Break Logs</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-700">
                                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                        <tr>
                                            <th class="p-3">Agent Name</th>
                                            <th class="p-3">Team</th>
                                            <th class="p-3">Login Time</th>
                                            <th class="p-3">Status</th>
                                            <th class="p-3">Break Reason</th>
                                            <th class="p-3">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${State.attendance.length === 0 ? `<tr><td colspan="6" class="p-4 text-center text-slate-400">No attendance logs found.</td></tr>` :
                                        State.attendance.map((att, idx) => `
                                            <tr>
                                                <td class="p-3 font-medium text-slate-900">${att.name} (${att.username})</td>
                                                <td class="p-3 text-slate-600">${att.team}</td>
                                                <td class="p-3 text-slate-500">${att.loginTime}</td>
                                                <td class="p-3">
                                                    <span class="px-2 py-1 rounded-full text-xs font-semibold ${att.logoutTime ? 'bg-slate-100 text-slate-600' : (att.onBreak ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700')}">
                                                        ${att.logoutTime ? 'Offline' : (att.onBreak ? `On Break (${att.breakReason})` : 'Active Duty')}
                                                    </span>
                                                </td>
                                                <td class="p-3 text-slate-500">${att.breakReason || 'None'}</td>
                                                <td class="p-3 flex gap-2">
                                                    <button onclick="adminForceLogout(${idx})" class="text-amber-600 hover:text-amber-800 text-xs font-semibold bg-amber-50 px-2 py-1 rounded border border-amber-200">Close Shift</button>
                                                    <button onclick="deleteAttendance(${idx})" class="text-red-500 hover:text-red-700 text-xs font-semibold bg-red-50 px-2 py-1 rounded border border-red-200">Clear Log</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="${State.adminTab === 'reports' ? '' : 'hidden'} space-y-6">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">📝 Manual Report Entry (Admin Override)</h3>
                            <form id="adminReportForm" class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Select Agent</label>
                                    <select id="adminAgentUsername" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                        <option value="">Choose Agent</option>
                                        ${agents.map(a => `<option value="${a.username}">${a.name} (${a.username})</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Date</label>
                                    <input type="date" id="adminReportDate" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm">
                                </div>
                                <div>

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(State));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "ghorerbazar_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.importData = function(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.users && parsed.reports) {
                            State.users = parsed.users;
                            State.reports = parsed.reports;
                            State.attendance = parsed.attendance || [];
                            State.targets = parsed.targets || {};
                            saveState();
                            alert('Data restored successfully!');
                            render();
                        } else {
                            alert('Invalid backup file format!');
                        }
                    } catch (err) {
                        alert('Error parsing JSON file!');
                    }
                };
            }
        }

        function attachAdminEvents() {
            const form = document.getElementById('createAgentForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('newName').value.trim();
                    const username = document.getElementById('newUsername').value.trim();
                    const password = document.getElementById('newPassword').value.trim();
                    const team = document.getElementById('newTeam').value;

                    if (State.users.some(u => String(u.username).trim() === username)) {
                        alert('Username / Emp ID already exists!');
                        return;
                    }

                    State.users.push({ id: Date.now(), name, username, password, role: 'agent', team, active: true });
                    State.targets[username] = 50000;
                    saveState();
                    alert('Agent created successfully!');
                    render();
                });
            }

            const adminReportForm = document.getElementById('adminReportForm');
            if (adminReportForm) {
                adminReportForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('adminAgentUsername').value;
                    const dateVal = document.getElementById('adminReportDate').value;
                    const leads = parseInt(document.getElementById('adminLeads').value) || 0;
                    const orders = parseInt(document.getElementById('adminOrders').value) || 0;
                    const amount = parseFloat(document.getElementById('adminAmount').value) || 0;

                    const agent = State.users.find(u => u.username === username);
                    if (!agent) return;

                    const formattedDate = new Date(dateVal).toLocaleDateString();

                    State.reports.push({
                        username: agent.username,
                        name: agent.name,
                        team: agent.team,
                        leads,
                        orders,
                        amount,
                        date: formattedDate
                    });
                    saveState();
                    alert('Manual report added successfully!');
                    render();
                });
            }
        }

        }

        window.resumeWork = function() {
            const att = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            if (att) {
                att.onBreak = false;
                att.breakReason = '';
                saveState();
                render();
            }
        }

        function attachAgentEvents() {
            const form = document.getElementById('reportForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const leads = parseInt(document.getElementById('leads').value) || 0;
                    const orders = parseInt(document.getElementById('orders').value) || 0;
                    const amount = parseFloat(document.getElementById('amount').value) || 0;
                    
                    State.reports.push({
                        username: State.currentUser.username,
                        name: State.currentUser.name,
                        team: State.currentUser.team,
                        leads,
                        orders,
                        amount,
                        date: new Date().toLocaleDateString()
                    });
                    saveState();
                    alert('Report submitted successfully!');
                    render();
                });
            }
        }

        window.logout = function() {
            const att = State.attendance.find(a => a.username === State.currentUser.username && !a.logoutTime);
            if (att) {
                att.logoutTime = new Date().toLocaleTimeString();
                att.onBreak = false;
            }
            State.currentUser = null;
            saveState();
            render();
        }

        render();
    </script>
</body>
</html>
